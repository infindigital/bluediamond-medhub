name: Deploy Blue Diamond clone to GitHub Pages

on:
  push:
    branches:
      - claude/bluediamondmed-website-clone-km3phx
    paths:
      - "bluediamondmed-clone/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site (bluediamondmed-clone/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: bluediamondmed-clone
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
